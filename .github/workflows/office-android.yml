name: office-android

on:
  # TEMPORARY (remove before merge)
  push:
    branches: [m0/ci]
    paths: ['.github/workflows/office-android.yml']
  workflow_dispatch:
    inputs:
      abi:
        description: Target ABI (one engine configure per ABI)
        type: choice
        options: [arm64-v8a, x86_64]
        default: arm64-v8a
      chain_count:
        description: Resume counter (0 for a fresh chain; the workflow increments it when re-dispatching itself)
        type: string
        default: '0'
      chain_start:
        description: Epoch seconds when the chain started (set automatically on re-dispatch)
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: office-android-${{ inputs.abi || 'arm64-v8a' }}
  cancel-in-progress: false

env:
  ABI: ${{ inputs.abi || 'arm64-v8a' }}
  IN_CHAIN_COUNT: ${{ inputs.chain_count }}
  IN_CHAIN_START: ${{ inputs.chain_start }}
  NDK_VERSION: 29.0.14206865
  MAX_CHAIN: 4
  # make budget measured from job start: 6 h limit minus >= 25 min for cache save / re-dispatch
  MAKE_DEADLINE_MIN: 325
  # if make finishes with less than this left, resume in a fresh run so the app/gradle stage gets a full budget
  MIN_LEFT_FOR_APP_MIN: 90

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Job start time, input validation and chain guard
        run: |
          for v in "${IN_CHAIN_COUNT:-0}" "${IN_CHAIN_START:-0}"; do
            case "$v" in ''|*[!0-9]*) echo "::error::non-numeric input"; exit 1 ;; esac
          done
          chain_count=${IN_CHAIN_COUNT:-0}
          chain_start=${IN_CHAIN_START:-$(date +%s)}
          { echo "JOB_START=$(date +%s)"; echo "CHAIN_COUNT=$chain_count"; echo "CHAIN_START=$chain_start"; } >> "$GITHUB_ENV"
          if [ "$chain_count" -ge "$MAX_CHAIN" ]; then
            echo "::error::chain_count=$chain_count reached the maximum of $MAX_CHAIN runs"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read upstream.lock
        run: |
          . ./upstream.lock
          { echo "UP_URL=$url"; echo "UP_BRANCH=$branch"; echo "UP_COMMIT=$commit"; } >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/julia* \
            "$AGENT_TOOLSDIRECTORY/CodeQL" /opt/hostedtoolcache/CodeQL
          # keep the Android SDK + cmdline-tools, drop preinstalled NDKs we do not use
          sudo rm -rf "$ANDROID_HOME"/ndk/*
          docker image prune --all --force >/dev/null || true
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "free GB: $avail"
          if [ "$avail" -lt 40 ]; then echo "::error::only ${avail} GB free, need >= 40"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config build-essential git ccache gperf nasm flex bison \
            zip unzip xsltproc libxml2-utils python3 python3-dev python3-polib python3-lxml python3-setuptools \
            ant perl m4 patch curl ca-certificates cmake ninja-build \
            libfontconfig-dev libfreetype-dev libcups2-dev libx11-dev libxt-dev libxext-dev libxrender-dev \
            libgl-dev libglu1-mesa-dev libkrb5-dev libnss3-dev libcap-dev libpam0g-dev libssl-dev

      - name: Install Android NDK, build-tools and platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "build-tools;37.0.0" "platforms;android-37.0" "cmake;3.22.1"
          ls "$ANDROID_HOME/ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Fetch pinned upstream
        run: |
          mkdir online && cd online
          git init -q
          git remote add origin "$UP_URL"
          if ! git fetch -q --depth 1 origin "$UP_COMMIT"; then
            git fetch -q --depth 300 origin "refs/heads/$UP_BRANCH"
          fi
          git checkout -q "$UP_COMMIT"
          git log -1 --oneline

      - name: Apply patches
        if: hashFiles('patches/*.patch') != ''
        working-directory: online
        run: |
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do echo "applying $p"; git apply --verbose "$p"; done

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.ABI }}-${{ env.UP_COMMIT }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.ABI }}-${{ env.UP_COMMIT }}-

      - name: Restore external tarballs
        id: extar
        uses: actions/cache/restore@v4
        with:
          path: ~/external-tar
          key: external-tar-${{ env.UP_COMMIT }}

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache ~/external-tar
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            echo "CCACHE_MAXSIZE=6G"
          } >> "$GITHUB_ENV"
          CCACHE_DIR=$HOME/.ccache ccache -z
          echo "ccache restored: ${{ steps.ccache.outputs.cache-matched-key || 'none (cold)' }}"

      - name: Configure engine
        working-directory: online/engine
        run: |
          case "$ABI" in
            arm64-v8a) DISTRO=CPAndroidAarch64 ;;
            x86_64)    DISTRO=CPAndroidX86_64 ;;
            *) echo "::error::unknown ABI $ABI"; exit 1 ;;
          esac
          # release only: no --enable-dbgutil / --enable-debug / --enable-sal-log. Same flags for both ABIs.
          # (--disable-branding is a top-level configure option, not an engine one.)
          cat > autogen.input <<EOT
          --with-android-ndk=$ANDROID_HOME/ndk/$NDK_VERSION
          --with-android-sdk=$ANDROID_HOME
          --with-distro=$DISTRO
          --with-external-tar=$HOME/external-tar
          EOT
          cat autogen.input
          ./autogen.sh

      - name: Cross-build diagnostics (after configure)
        working-directory: online/engine
        run: |
          grep -E '^export (CROSS_COMPILING|WORKDIR|WORKDIR_FOR_BUILD|BUILDDIR_FOR_BUILD|INSTDIR_FOR_BUILD|BUILDDIR|OS|OS_FOR_BUILD)=' config_host.mk || true
          grep -E '^(WORKDIR|INSTDIR)' config_build.mk || true
          ls -d workdir* instdir* CONF-FOR-BUILD 2>&1 || true

      - name: Build engine (time-boxed)
        id: make
        working-directory: online/engine
        run: |
          budget=$(( JOB_START + MAKE_DEADLINE_MIN*60 - $(date +%s) ))
          echo "make budget: $budget s"
          if [ "$budget" -le 0 ]; then
            rc=124
          else
            set +e
            timeout -k 10m -s INT "$budget" make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/make.log"
            rc=${PIPESTATUS[0]}
            set -e
          fi
          echo "make rc=$rc"
          left=$(( JOB_START + 360*60 - $(date +%s) ))
          if [ "$rc" = 0 ] && [ "$left" -lt $(( MIN_LEFT_FOR_APP_MIN*60 )) ]; then
            echo "make finished but only $((left/60)) min left; resuming in a fresh run for the app stage"
            status=resume
          elif [ "$rc" = 0 ]; then status=done
          elif [ "$rc" = 124 ] || [ "$rc" = 137 ]; then status=resume
          else status=fail; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Diagnostics on make failure
        if: always() && steps.make.outputs.status == 'fail'
        working-directory: online/engine
        run: |
          grep -E '^export (CROSS_COMPILING|WORKDIR|WORKDIR_FOR_BUILD|BUILDDIR_FOR_BUILD|INSTDIR_FOR_BUILD)=' config_host.mk || true
          ls -la workdir_for_build/LinkTarget/Executable 2>&1 | head -40 || true
          ls -la workdir/LinkTarget/Executable 2>&1 | head -20 || true
          tail -n 120 "$RUNNER_TEMP/make.log"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        id: save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.ABI }}-${{ env.UP_COMMIT }}-${{ github.run_id }}

      - name: Save external tarballs
        if: always() && steps.extar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/external-tar
          key: external-tar-${{ env.UP_COMMIT }}

      - name: Delete superseded ccache entries
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cur="ccache-$ABI-$UP_COMMIT-${{ github.run_id }}"
          keys=$(gh cache list --ref "$GITHUB_REF" --key "ccache-$ABI-$UP_COMMIT-" --limit 100 --json id,key --jq '.[]|"\(.id) \(.key)"')
          echo "$keys"
          if echo "$keys" | grep -q " $cur\$"; then
            echo "$keys" | awk -v c="$cur" '$2!=c{print $1}' | while read -r id; do gh cache delete "$id" || true; done
          fi

      - name: Chain summary and re-dispatch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_RC: ${{ steps.make.outputs.rc }}
          MAKE_STATUS: ${{ steps.make.outputs.status }}
        run: |
          now=$(date +%s)
          {
            echo "## office-android $ABI"
            echo "- upstream commit: \`$UP_COMMIT\`"
            echo "- run in chain: $((CHAIN_COUNT+1)) of max $MAX_CHAIN"
            echo "- this run wall-clock: $(( (now-JOB_START)/60 )) min"
            echo "- chain wall-clock so far: $(( (now-CHAIN_START)/60 )) min"
            echo "- make exit code: ${MAKE_RC:-n/a}, status: ${MAKE_STATUS:-n/a} (resume = time budget hit)"
            echo '```'; ccache -s; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAKE_STATUS" = resume ]; then
            next=$((CHAIN_COUNT+1))
            if [ "$next" -ge "$MAX_CHAIN" ]; then
              echo "::error::engine/app build still unfinished after $MAX_CHAIN runs; chain guard hit"; exit 1
            fi
            gh workflow run office-android.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f abi="$ABI" -f chain_count="$next" -f chain_start="$CHAIN_START"
            echo "- re-dispatched as chain_count=$next" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if make failed for a real reason
        if: steps.make.outputs.status == 'fail'
        run: echo "::error::engine make failed (rc=${{ steps.make.outputs.rc }})"; exit 1

      # ---- everything below only runs when the engine make finished ----
      - name: Configure Android app (top level)
        if: steps.make.outputs.status == 'done'
        working-directory: online
        run: |
          ./autogen.sh
          ./configure --enable-androidapp --disable-branding

      - name: Build browser assets and app glue (top level make)
        if: steps.make.outputs.status == 'done'
        working-directory: online
        run: make -j"$(nproc)"

      - name: Gradle build AAR (browser assets are built by the generate*Assets tasks)
        if: steps.make.outputs.status == 'done'
        working-directory: online/android
        run: |
          if [ "$ABI" = x86_64 ]; then task=:lib:assembleDebug; else task=:lib:assembleRelease; fi
          ./gradlew --no-daemon "$task"

      - name: Collect, licence and checksum AAR
        if: steps.make.outputs.status == 'done'
        run: |
          variant=release; [ "$ABI" = x86_64 ] && variant=debug
          aar=$(ls online/android/build/lib/outputs/aar/lib-$variant.aar online/android/lib/build/outputs/aar/lib-$variant.aar 2>/dev/null | head -1)
          [ -n "$aar" ] || { echo "::error::lib-$variant.aar not found"; find online/android -name '*.aar'; exit 1; }
          mkdir -p out && cd out
          cp "$GITHUB_WORKSPACE/$aar" "quiredocs-office-android-$ABI.aar"
          cp "$GITHUB_WORKSPACE/upstream.lock" .
          mkdir licences
          cp "$GITHUB_WORKSPACE"/online/CODA-THIRDPARTYLICENSES.html "$GITHUB_WORKSPACE"/online/THIRDPARTYLICENSES \
             "$GITHUB_WORKSPACE"/online/engine/COPYING.MPL licences/
          cat > licences.json <<EOT
          [
            {"name": "Collabora Online monorepo (online + engine)", "commit": "$UP_COMMIT", "licence": "MPL-2.0", "files": ["licences/COPYING.MPL"]},
            {"name": "Third-party components", "licence": "various, see files", "files": ["licences/CODA-THIRDPARTYLICENSES.html", "licences/THIRDPARTYLICENSES"]}
          ]
          EOT
          python3 -m json.tool licences.json >/dev/null
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          so_size=$(unzip -lv "quiredocs-office-android-$ABI.aar" | awk '/liblo-native-code.so/{print $1" bytes uncompressed, "$3" compressed"}')
          {
            echo "### AAR ($ABI)"
            echo "- AAR size: $(du -h "quiredocs-office-android-$ABI.aar" | cut -f1) ($(stat -c %s "quiredocs-office-android-$ABI.aar") bytes)"
            echo "- liblo-native-code.so: ${so_size:-not found in AAR}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAR
        if: steps.make.outputs.status == 'done'
        uses: actions/upload-artifact@v4
        with:
          name: quiredocs-office-android-${{ env.ABI }}
          path: out/
          if-no-files-found: error
